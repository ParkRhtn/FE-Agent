# push·PR 마다 린트·타입 검사. 백엔드 없이 돈다 (API 타입은 저장소의 schema.d.ts 를 쓴다).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # package.json 의 packageManager(pnpm 버전)를 따른다

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 린트 (eslint)
        run: pnpm lint

      - name: 타입 검사 (tsc)
        run: pnpm typecheck
